name: Docker image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  FRONTEND_IMAGE: ghcr.io/basketikun/infinite-canvas
  BACKEND_IMAGE: ghcr.io/basketikun/infinite-canvas-backend

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
    steps:
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.FRONTEND_IMAGE }}
            ${{ env.BACKEND_IMAGE }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=

  build:
    needs: meta
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ghcr.io/basketikun/infinite-canvas
            dockerfile: Dockerfile
            platform: linux/amd64
            arch: frontend-amd64
            runner: ubuntu-latest
          - image: ghcr.io/basketikun/infinite-canvas
            dockerfile: Dockerfile
            platform: linux/arm64
            arch: frontend-arm64
            runner: ubuntu-24.04-arm
          - image: ghcr.io/basketikun/infinite-canvas-backend
            dockerfile: backend/Dockerfile
            platform: linux/amd64
            arch: backend-amd64
            runner: ubuntu-latest
          - image: ghcr.io/basketikun/infinite-canvas-backend
            dockerfile: backend/Dockerfile
            platform: linux/arm64
            arch: backend-arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          labels: ${{ needs.meta.outputs.labels }}
          outputs: type=image,name=${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Export digest
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/digests-${{ matrix.arch }}"
          digest="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests-${{ matrix.arch }}/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1

  merge:
    needs:
      - meta
      - build
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Create multi-arch manifests
        shell: bash
        env:
          TAGS: ${{ needs.meta.outputs.tags }}
        run: |
          frontend_tags=()
          backend_tags=()
          while IFS= read -r tag; do
            if [ -z "$tag" ]; then
              continue
            fi
            case "$tag" in
              "$FRONTEND_IMAGE:"*) frontend_tags+=("-t" "$tag") ;;
              "$BACKEND_IMAGE:"*) backend_tags+=("-t" "$tag") ;;
            esac
          done <<< "$TAGS"

          frontend_digests=()
          backend_digests=()
          while IFS= read -r digest_file; do
            digest="${digest_file##*/}"
            if [[ "$digest_file" == *backend-* ]]; then
              backend_digests+=("${BACKEND_IMAGE}@sha256:${digest}")
            else
              frontend_digests+=("${FRONTEND_IMAGE}@sha256:${digest}")
            fi
          done < <(find "$RUNNER_TEMP/digests" -type f -printf '%p\n' | sort)

          if [ "${#frontend_tags[@]}" -gt 0 ] && [ "${#frontend_digests[@]}" -gt 0 ]; then
            docker buildx imagetools create "${frontend_tags[@]}" "${frontend_digests[@]}"
          fi
          if [ "${#backend_tags[@]}" -gt 0 ] && [ "${#backend_digests[@]}" -gt 0 ]; then
            docker buildx imagetools create "${backend_tags[@]}" "${backend_digests[@]}"
          fi