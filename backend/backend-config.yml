# 后端本地配置文件
# 修改后需要重启后端生效。

app:
  # 后端公网访问地址，用于给 Agnes 等第三方服务访问本地后端上传的图片。
  # 示例：https://your-public-domain.example。留空时无法向需要公网参考图的第三方视频模型提交本地图片。
  public-base-url: https://gycmservice.nas.cpolar.cn

  # 后端代理 ComfyUI 时使用的真实 ComfyUI 地址。
  comfyui-base-url: http://127.0.0.1:8188

  # 媒体访问链接使用短期 HMAC 签名。未配置 MEDIA_SIGNING_SECRET 时后端会自动
  # 生成随机密钥（重启后旧链接失效）；建议通过环境变量设置独立随机密钥。
  media-url-ttl-seconds: 43200
