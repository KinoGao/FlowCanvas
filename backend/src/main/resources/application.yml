spring:
  config:
    import:
      - optional:file:./backend-config.yml
      - optional:file:./backend/backend-config.yml
      - optional:file:./data/backend-config.yml
  datasource:
    url: jdbc:sqlite:${DB_PATH:./data/app.db}?busy_timeout=5000&journal_mode=WAL
    driver-class-name: org.sqlite.JDBC
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    show-sql: false
  servlet:
    multipart:
      max-file-size: ${USER_FILE_MAX_SIZE:512MB}
      max-request-size: ${USER_REQUEST_MAX_SIZE:512MB}

server:
  port: ${PORT:9801}
  tomcat:
    max-http-form-post-size: ${USER_REQUEST_MAX_SIZE:512MB}
    max-swallow-size: ${USER_REQUEST_MAX_SIZE:512MB}

app:
  # 内部部署硬编码默认值（可通过环境变量覆盖）：
  # - AUTH_CODE / REGISTRATION_CODE 默认 gycode
  # - ADMIN_CODE 默认 admincode
  # - MEDIA_SIGNING_SECRET 默认继承 ADMIN_CODE
  # 公网部署请务必通过环境变量显式设置以上三项。
  auth-code: ${AUTH_CODE:gycode}
  registration-code: ${REGISTRATION_CODE:${AUTH_CODE:gycode}}
  admin-code: ${ADMIN_CODE:admincode}
  media-signing-secret: ${MEDIA_SIGNING_SECRET:${ADMIN_CODE:admincode}}
  media-url-ttl-seconds: ${MEDIA_URL_TTL_SECONDS:43200}
  public-base-url: "${PUBLIC_BASE_URL:https://gycmservice.nas.cpolar.cn}"
  comfyui-base-url: "${COMFYUI_BASE_URL:https://gycmfy.nas.cpolar.cn}"
  public-image-dir: ${PUBLIC_IMAGE_DIR:./data/public-images}
  user-file-dir: ${USER_FILE_DIR:./data/user-files}
  workflow-dir: ${WORKFLOW_DIR:./data/workflows}
  model-capabilities:
    video:
      - id: agnes-video-v2
        provider: agnes
        request-adapter: agnes-v2
        model-patterns: ['agnes-video-v2.0', 'agnes-video-v2*']
        modes: ['text-to-video', 'image-to-video', 'first-last-frame']
        ratios: ['16:9', '9:16', '1:1', '4:3', '3:4']
        resolutions: ['480p', '720p', '1080p']
        durations: [4, 5, 6, 8, 10, 12, 15, 18]
        counts: [1]
        generate-audio: false
        watermark: false
        max-images: 2
        max-videos: 0
        max-audios: 0
