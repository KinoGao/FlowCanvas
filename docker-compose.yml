services:
  app:
    image: ghcr.io/basketikun/infinite-canvas:latest
    container_name: infinite-canvas
    ports:
      - "9800:9800"
    restart: unless-stopped
  backend:
    image: ghcr.io/basketikun/infinite-canvas-backend:latest
    container_name: infinite-canvas-backend
    ports:
      - "9801:9801"
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    environment:
      # 内部部署默认使用硬编码凭证（gycode / admincode），可通过环境变量覆盖。
      - AUTH_CODE=${AUTH_CODE:-gycode}
      - ADMIN_CODE=${ADMIN_CODE:-admincode}
      - MEDIA_SIGNING_SECRET=${MEDIA_SIGNING_SECRET:-admincode}
      - DB_PATH=/app/data/app.db
